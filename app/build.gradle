plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minube.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.minube.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Misma firma en todas las compilaciones: la app se actualiza encima de la anterior.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
