plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buscador.imagenes'
    compileSdk 34

    defaultConfig {
        applicationId "com.buscador.imagenes"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Misma firma en todas las compilaciones: así la app se actualiza
    // encima de la anterior sin tener que desinstalarla.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
